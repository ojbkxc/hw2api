# 云端构建 debug APK —— 免装 Android Studio
# 触发：任意 push 自动触发；或 Actions → Build Debug APK → Run workflow 手动触发
# 产物：运行详情页底部 Artifacts → hw2api-debug-apk（zip 解压得 app-debug.apk）
# 说明：本仓库未携带 gradle-wrapper.jar（见 README-GRADLE-WRAPPER.txt），
#       此处直接安装 Gradle 8.9 使用，效果与 wrapper 等效，无需先补全 wrapper。
name: Build Debug APK

on: [push, workflow_dispatch]

# 同一分支连续 push 时自动取消旧构建，节省 Actions 时长
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK 且许可已预接受；此步骤兜底确保
      # sdkmanager / cmdline-tools 可用，缺 Platform 35 时 AGP 可自动补下
      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 运行 core 单元测试
        run: gradle :core:test --stacktrace

      - name: 构建 debug APK
        run: gradle :app:assembleDebug --stacktrace

      # 测试或构建失败时上传报告，便于远程排查
      - name: 上传测试报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: hw2api-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
